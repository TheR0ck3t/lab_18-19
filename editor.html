<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Edytor</title>
</head>
<body>
  <h1>Edytor</h1>
  <div id="editor"></div>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) {
        document.getElementById("editor").textContent = "Brak ID do wczytania danych.";
        return;
      }

      try {
        const response = await fetch(`/api/load.php?type=form&id=${id}`);
        if (!response.ok) {
          throw new Error("Błąd podczas pobierania danych.");
        }
        const data = await response.json();
        document.getElementById("editor").innerHTML = `
          <h2>${data.form_name || data.template_name}</h2>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        console.error("Błąd:", error);
        document.getElementById("editor").textContent = "Nie udało się wczytać danych.";
      }
    });
  </script>
</body>
</html>
